name: Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint and build APK/AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PINPIN_KEYSTORE_BASE64: ${{ secrets.PINPIN_KEYSTORE_BASE64 }}
      PINPIN_STORE_PASSWORD: ${{ secrets.PINPIN_STORE_PASSWORD }}
      PINPIN_KEY_ALIAS: ${{ secrets.PINPIN_KEY_ALIAS }}
      PINPIN_KEY_PASSWORD: ${{ secrets.PINPIN_KEY_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore fixed release signing key
        if: env.PINPIN_KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$PINPIN_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pinpin-release.p12"
          chmod 600 "$RUNNER_TEMP/pinpin-release.p12"
          echo "PINPIN_STORE_FILE=$RUNNER_TEMP/pinpin-release.p12" >> "$GITHUB_ENV"

      - name: Build fixed-signature release
        if: env.PINPIN_KEYSTORE_BASE64 != ''
        run: ./gradlew --no-daemon lintRelease assembleRelease bundleRelease

      - name: Build pull-request fallback
        if: env.PINPIN_KEYSTORE_BASE64 == ''
        run: ./gradlew --no-daemon lintDebug assembleDebug

      - name: Collect outputs and checksums
        run: |
          mkdir -p dist
          find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -exec cp {} dist/ \;
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pinpin-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-${{ github.sha }}
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 14
