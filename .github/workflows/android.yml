name: Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PINPIN_KEYSTORE_BASE64: ${{ secrets.PINPIN_KEYSTORE_BASE64 }}
      PINPIN_STORE_PASSWORD: ${{ secrets.PINPIN_STORE_PASSWORD }}
      PINPIN_KEY_ALIAS: ${{ secrets.PINPIN_KEY_ALIAS }}
      PINPIN_KEY_PASSWORD: ${{ secrets.PINPIN_KEY_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "15859902"

      - name: Install Android 17 preview SDK
        run: android sdk install --canary platforms/android-37 build-tools/37.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore fixed release signing key
        if: env.PINPIN_KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$PINPIN_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pinpin-release.p12"
          chmod 600 "$RUNNER_TEMP/pinpin-release.p12"
          echo "PINPIN_STORE_FILE=$RUNNER_TEMP/pinpin-release.p12" >> "$GITHUB_ENV"

      - name: Build fixed-signature release
        if: env.PINPIN_KEYSTORE_BASE64 != ''
        run: ./gradlew --no-daemon lintRelease assembleRelease

      - name: Verify fixed APK certificate
        if: env.PINPIN_KEYSTORE_BASE64 != ''
        run: |
          expected="717e4c8025d288331bb323800eb759d478f9e71bc3ca9db5cad613881081116f"
          apk="app/build/outputs/apk/release/app-release.apk"
          certs=$("$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$apk")
          actual=$(printf '%s\n' "$certs" | awk '/certificate SHA-256 digest:/ {print $NF; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test "$actual" = "$expected"
          echo "Verified fixed release certificate: $actual"

      - name: Build pull-request fallback
        if: env.PINPIN_KEYSTORE_BASE64 == ''
        run: ./gradlew --no-daemon lintDebug assembleDebug

      - name: Upload signed release APK
        if: env.PINPIN_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: pinpin-apk-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload pull-request debug APK
        if: env.PINPIN_KEYSTORE_BASE64 == ''
        uses: actions/upload-artifact@v4
        with:
          name: pinpin-debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
